<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e3c72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עת רצון">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<title>עת רצון · לוח הצלצולים</title>
<style>
  :root { --accent: #1e3c72; --accent-2: #2a5298; --bg: #f4f6fa; --card: #fff; --ink: #1f2933; --muted: #6b7280;
    --line: #e5e7eb; --on: #16a34a; --today: #d97706; --off: #dc2626; --next: #f97316; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Rubik", "Assistant", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  /* כותרת נמוכה וקומפקטית: שעה, תאריך, מצב, אירוע קודם / הבא */
  header { position: sticky; top: 0; z-index: 5; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; padding: calc(6px + env(safe-area-inset-top)) 12px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .h-top { display: flex; align-items: center; gap: 10px; }
  .school { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { font-size: 1.55rem; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; direction: ltr; }
  .h-date { font-size: 0.72rem; opacity: .85; margin-top: 1px; }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 700; border-radius: 999px;
    padding: 3px 10px; background: rgba(255,255,255,.95); color: var(--on); white-space: nowrap; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.today { color: var(--today); } .status.off { color: var(--off); }
  .h-events { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .h-ev { background: rgba(255,255,255,.14); border-radius: 8px; padding: 4px 8px; min-width: 0; }
  .h-ev .k { font-size: 0.65rem; opacity: .85; } .h-ev .v { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-ev .t { font-variant-numeric: tabular-nums; } .h-ev.next .cd { color: #ffe08a; }
  /* הודעה רצה */
  .ticker { background: #fff7d6; color: #6b4e00; border-bottom: 1px solid #f3e3a3; overflow: hidden; white-space: nowrap; font-weight: 600; font-size: 0.95rem; }
  .ticker .track { display: inline-block; padding: 7px 0; padding-inline-start: 100%; animation: tick 25s linear infinite; }
  .ticker .item { margin: 0 28px; } @keyframes tick { from { transform: translateX(0); } to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; padding-inline-start: 12px; white-space: normal; } }
  .notice { margin: 10px 12px 0; border-radius: 10px; padding: 9px 12px; font-size: 0.85rem; background: #fde8e8; color: #8a1c1c; }
  .notice.info { background: #e8f0fe; color: #1e3a8a; }
  /* ימים */
  .days { display: flex; gap: 6px; padding: 10px 12px 4px; overflow-x: auto; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day-btn { flex: 1 0 auto; min-width: 46px; border: 0; border-radius: 10px; padding: 8px 6px; background: var(--card); color: var(--ink);
    font: inherit; font-size: 0.9rem; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: pointer; }
  .day-btn.sel { background: var(--accent); color: #fff; } .day-btn.is-today:not(.sel) { outline: 2px solid var(--accent); }
  main { padding: 6px 12px calc(24px + env(safe-area-inset-bottom)); }
  .col-title { display: none; }
  .ev { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); border-inline-start: 5px solid transparent; }
  .ev .time { font-size: 1.05rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 52px; direction: ltr; text-align: start; }
  .ev .name { font-size: 1.2rem; font-weight: 700; line-height: 1.3; flex: 1; }
  .ev .kind { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
  .ev.past { opacity: .5; } .ev.next { border-color: var(--next); background: #fff4ea; }
  .ev.next .time { color: var(--next); } .ev.playing { border-color: var(--on); background: #ecfdf3; }
  .ev.msg { display: block; border-color: #e0b200; } .ev.msg .name { white-space: pre-wrap; }
  .tag { display: inline-block; font-size: 0.68rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; vertical-align: middle; }
  .tag.next { background: var(--next); color: #fff; } .tag.playing { background: var(--on); color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .me-btn { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 999px; height: 30px; min-width: 30px; padding: 0 10px;
    font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg[hidden] { display: none; }
  .sheet { background: #fff; width: 100%; max-width: 460px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  @media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h3 { margin: 0 0 6px; color: var(--accent); font-size: 1.15rem; } .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 0.88rem; }
  .sheet input { width: 100%; font: inherit; font-size: 1.15rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .sheet input.code { letter-spacing: 8px; text-align: center; font-size: 1.6rem; font-weight: 800; }
  .sheet .row { display: flex; gap: 8px; } .sheet button { flex: 1; font: inherit; font-size: 1.05rem; font-weight: 700; padding: 13px; border-radius: 12px; border: 0; cursor: pointer; }
  .sheet .primary { background: var(--accent); color: #fff; } .sheet .ghost { background: #eef1f5; color: #333; }
  .sheet .err { color: var(--off); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 6px; }
  footer { text-align: center; color: var(--muted); font-size: 0.7rem; padding: 4px 12px 18px; }
  /* מסך רחב: כל השבוע */
  @media (min-width: 980px) {
    .days { display: none; } main.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .col-title { display: block; text-align: center; font-weight: 800; padding: 8px 0; border-radius: 10px; background: var(--card); margin-bottom: 8px; }
    .col.today .col-title { background: var(--accent); color: #fff; }
    .ev { padding: 9px 10px; gap: 8px; } .ev .name { font-size: 0.98rem; } .ev .time { font-size: 0.9rem; min-width: 44px; }
    .clock { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div style="flex:1;min-width:0"><div class="school" id="school">עת רצון</div><div class="h-date" id="date"></div></div>
    <span class="status" id="status">טוען...</span>
    <button class="me-btn" id="me-btn" onclick="meClick()" aria-label="כניסה למורשי עריכה">🔑</button>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="h-events">
    <div class="h-ev"><div class="k">אירוע קודם</div><div class="v" id="prev">—</div></div>
    <div class="h-ev next"><div class="k" id="next-k">האירוע הבא</div><div class="v" id="next">—</div></div>
  </div>
</header>
<div class="ticker" id="ticker" hidden><span class="track" id="ticker-track"></span></div>
<div id="notice"></div>
<nav class="days" id="days"></nav>
<main id="main"></main>
<footer id="footer"></footer>

<div class="sheet-bg" id="sheet" hidden onclick="if (event.target === this) closeSheet()">
  <div class="sheet" id="sheet-body"></div>
</div>

<script>
const TOKEN = location.pathname.split("/").filter(Boolean)[1] || "";
const DAY_ORDER = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_HEB = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const DAY_LETTER = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const KIND = { Bell: "צלצול", Music: "מוסיקה", Exercise: "תרגיל", Message: "הודעה" };
let board = null, etag = null, selDay = null, info = {};
const pad2 = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tsec = t => { const [h, m, s] = String(t || "0:0:0").split(":").map(Number); return h * 3600 + m * 60 + (s || 0); };
const shortT = t => String(t || "").slice(0, 5);
const fmtCd = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`; };
let hebFmt = null; try { hebFmt = new Intl.DateTimeFormat("he-u-ca-hebrew", { day: "numeric", month: "long", year: "numeric" }); } catch (e) {}

function silentOn(iso) { return ((board && board.special_dates) || []).find(x => x.date <= iso && iso <= (x.end_date || x.date)) || null; }
function isSound(ev) { return ev.type !== "Message"; }
function activeOn(ev, iso) { return ev.enabled !== false && ev.skip_date !== iso; }
function dayEvents(dayKey) { return ((board && board.weekly_schedule && board.weekly_schedule[dayKey]) || []).slice().sort((a, b) => a.time.localeCompare(b.time)); }

function systemState(now) {
  if (!board) return { cls: "", text: "טוען..." };
  const today = isoDate(now);
  if (board.license_blocked) return { cls: "off", text: "מושבת" };
  if (board.system_status === "disabled") {
    if (board.disabled_scope === "day" && board.disabled_date === today) return { cls: "today", text: "מושבת להיום" };
    if (board.disabled_scope !== "day") return { cls: "off", text: "מושבת" };
  }
  const sil = silentOn(today);
  if (sil) return { cls: "today", text: sil.label || "יום ללא צלצולים" };
  return { cls: "", text: "פעיל" };
}

// אירועי שמע קרובים: היום, ואם נגמרו - הימים הבאים (מדלגים על ימים ללא שמע)
function adjacent(now) {
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds(), today = isoDate(now);
  const todays = silentOn(today) ? [] : dayEvents(DAY_ORDER[now.getDay()]).filter(e => isSound(e) && activeOn(e, today));
  let prev = null, next = null, playing = null;
  todays.forEach((e, i) => {
    const st = tsec(e.time), later = todays.slice(i + 1).find(x => tsec(x.time) > st);
    const end = Math.min(st + (parseInt(e.duration_seconds, 10) || 0), later ? tsec(later.time) : Infinity);
    if (st <= nowSec && nowSec < end) playing = { ev: e, end };
    if (st <= nowSec) prev = { ev: e, dayOffset: 0 };
    else if (!next) next = { ev: e, dayOffset: 0, at: st - nowSec };
  });
  if (!next) {
    for (let k = 1; k <= 7 && !next; k++) {
      const d = new Date(now); d.setDate(d.getDate() + k); const iso = isoDate(d);
      if (silentOn(iso)) continue;
      const evs = dayEvents(DAY_ORDER[d.getDay()]).filter(e => isSound(e) && activeOn(e, iso));
      if (evs.length) next = { ev: evs[0], dayOffset: k, day: d.getDay(), at: (86400 - nowSec) + (k - 1) * 86400 + tsec(evs[0].time) };
    }
  }
  return { prev, next, playing };
}

function renderHeader() {
  const now = new Date();
  document.getElementById("clock").textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  const heb = hebFmt ? " · " + hebFmt.format(now) : "";
  document.getElementById("date").textContent = `יום ${DAY_HEB[now.getDay()]} ${pad2(now.getDate())}/${pad2(now.getMonth() + 1)}/${now.getFullYear()}${heb}`;
  const st = systemState(now), el = document.getElementById("status");
  el.textContent = st.text; el.className = "status " + st.cls;
  if (!board) return;
  const { prev, next, playing } = adjacent(now);
  document.getElementById("prev").innerHTML = prev ? `<span class="t">${shortT(prev.ev.time)}</span> ${esc(prev.ev.label)}` : "—";
  const nk = document.getElementById("next-k"), nv = document.getElementById("next");
  if (playing) { nk.textContent = "מתנגן עכשיו · נגמר בעוד " + fmtCd(playing.end - (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()));
    nv.innerHTML = `<span class="t">${shortT(playing.ev.time)}</span> ${esc(playing.ev.label)}`; }
  else if (next) { nk.innerHTML = `האירוע הבא · <span class="cd">בעוד ${fmtCd(next.at)}</span>`;
    nv.innerHTML = (next.dayOffset ? `${DAY_HEB[next.day]} ` : "") + `<span class="t">${shortT(next.ev.time)}</span> ${esc(next.ev.label)}`; }
  else { nk.textContent = "האירוע הבא"; nv.textContent = "—"; }
}

function evCard(e, iso, mark) {
  if (e.type === "Message") {
    if (e.msg_display === "ticker") return "";
    return `<div class="ev msg"><div class="kind">${esc(shortT(e.time))} · הודעה</div><div class="name">${esc(e.label)}</div>` +
      (e.msg_body ? `<div style="margin-top:4px;font-size:1rem">${esc(e.msg_body)}</div>` : "") + `</div>`;
  }
  const tag = mark === "playing" ? `<span class="tag playing">מתנגן</span>` : mark === "next" ? `<span class="tag next">הבא</span>` : "";
  return `<div class="ev ${mark || ""}"><div class="time">${shortT(e.time)}</div>` +
    `<div style="flex:1;min-width:0"><div class="name">${esc(e.label || KIND[e.type] || "")}${tag}</div><div class="kind">${KIND[e.type] || ""}</div></div></div>`;
}

function renderBoard() {
  const main = document.getElementById("main");
  if (!board) { main.innerHTML = `<div class="empty">טוען את הלוח...</div>`; return; }
  const now = new Date(), todayIdx = now.getDay(), nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  if (selDay === null) selDay = todayIdx;
  document.getElementById("days").innerHTML = DAY_ORDER.map((d, i) =>
    `<button class="day-btn${i === selDay ? " sel" : ""}${i === todayIdx ? " is-today" : ""}" onclick="pickDay(${i})" aria-label="יום ${DAY_HEB[i]}">${i === todayIdx ? "היום" : DAY_LETTER[i]}</button>`).join("");
  const { next, playing } = adjacent(now);
  const col = (i) => {
    const d = new Date(now); d.setDate(d.getDate() + ((i - todayIdx + 7) % 7)); const iso = isoDate(d);
    const sil = silentOn(iso);
    const evs = dayEvents(DAY_ORDER[i]).filter(e => activeOn(e, iso));
    let html = sil ? `<div class="notice info" style="margin:0 0 8px">${esc(sil.label || "יום ללא צלצולים")} - אין צלצולים</div>` : "";
    html += evs.map(e => {
      let mark = "";
      if (i === todayIdx && !sil && isSound(e)) {
        if (playing && playing.ev === e) mark = "playing";
        else if (next && next.dayOffset === 0 && next.ev === e) mark = "next";
        else if (tsec(e.time) < nowSec) mark = "past";
      } else if (next && next.dayOffset && next.day === i && next.ev === e) mark = "next";
      return evCard(e, iso, mark);
    }).join("");
    return html || `<div class="empty">אין אירועים ביום ${DAY_HEB[i]}</div>`;
  };
  const wide = matchMedia("(min-width: 980px)").matches;
  main.className = wide ? "week" : "";
  main.innerHTML = wide
    ? DAY_ORDER.map((d, i) => `<div class="col${i === todayIdx ? " today" : ""}"><div class="col-title">${DAY_HEB[i]}</div>${col(i)}</div>`).join("")
    : col(selDay);
  // הודעה רצה: הודעות מסוג "שורה רצה" של היום
  const iso = isoDate(now);
  const msgs = dayEvents(DAY_ORDER[todayIdx]).filter(e => e.type === "Message" && e.msg_display === "ticker" && activeOn(e, iso));
  const tk = document.getElementById("ticker");
  tk.hidden = !msgs.length;
  const txt = msgs.map(m => `<span class="item">${esc(m.label)}${m.msg_body ? " · " + esc(m.msg_body) : ""}</span>`).join("✦");
  const tr = document.getElementById("ticker-track");
  if (tr.dataset.t !== txt) { tr.innerHTML = txt; tr.dataset.t = txt; }
}
function pickDay(i) { selDay = i; renderBoard(); }

function renderNotices() {
  const box = document.getElementById("notice"); let html = "";
  if (info.pc_offline_min != null && info.pc_offline_min >= 15)
    html += `<div class="notice">מחשב הצלצולים בבית הספר לא מחובר כרגע לאינטרנט (מאז לפני ${info.pc_offline_min >= 120 ? Math.round(info.pc_offline_min / 60) + " שעות" : info.pc_offline_min + " דקות"}). ייתכן שהלוח לא עדכני.</div>`;
  if (info.offline) html += `<div class="notice">אין חיבור לאינטרנט בטלפון. מוצג הלוח האחרון שנטען.</div>`;
  box.innerHTML = html;
  document.getElementById("footer").textContent = info.updated_at ? "הלוח עודכן ב-" + new Date(info.updated_at).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" }) + " · עת רצון" : "עת רצון";
}

async function load() {
  try {
    const r = await fetch("/api/view/" + encodeURIComponent(TOKEN), { headers: etag ? { "If-None-Match": etag } : {}, cache: "no-store" });
    info.offline = false;
    if (r.status === 304) { renderNotices(); return; }
    if (r.status === 404) { document.getElementById("main").innerHTML = `<div class="empty">הקישור לא תקין או הוחלף. בקשו קישור חדש מבית הספר.</div>`; return; }
    if (!r.ok) return;
    etag = r.headers.get("ETag");
    const d = await r.json();
    board = d.board || {}; info = Object.assign(info, d);
    try { localStorage.setItem("board:" + TOKEN, JSON.stringify(d)); } catch (e) {}
    applyTheme(); renderBoard(); renderHeader(); renderNotices();
  } catch (e) {
    info.offline = true;
    if (!board) { try { const c = JSON.parse(localStorage.getItem("board:" + TOKEN) || "null"); if (c) { board = c.board; info = Object.assign(info, c); applyTheme(); renderBoard(); } } catch (x) {} }
    renderNotices();
  }
}
function applyTheme() {
  document.getElementById("school").textContent = board.name || "עת רצון";
  document.title = "עת רצון · " + (board.name || "לוח הצלצולים");
  if (/^#[0-9a-f]{6}$/i.test(board.accent_color || "")) { document.documentElement.style.setProperty("--accent", board.accent_color); document.documentElement.style.setProperty("--accent-2", board.accent_color); }
}

// ---------------- כניסה למורשי עריכה: מייל ← קוד חד-פעמי במייל ----------------
let me = null, loginEmail = "";
const appApi = async (path, body) => {
  const r = await fetch("/api/app/" + encodeURIComponent(TOKEN) + path, body === undefined ? { credentials: "same-origin" } :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" });
  let d = {}; try { d = await r.json(); } catch (e) {}
  return { ok: r.ok && d.ok !== false, d };
};
function renderMe() {
  const b = document.getElementById("me-btn");
  b.textContent = me ? "👤 " + me.name : "🔑";
  b.setAttribute("aria-label", me ? "מחובר: " + me.name : "כניסה למורשי עריכה");
}
async function loadMe() { const { ok, d } = await appApi("/me"); if (ok) { me = d.editor; renderMe(); } }
function openSheet(html) { document.getElementById("sheet-body").innerHTML = html; document.getElementById("sheet").hidden = false; }
function closeSheet() { document.getElementById("sheet").hidden = true; }
function meClick() {
  if (me) return openSheet(`<h3>👤 ${esc(me.name)}</h3><p>מחובר/ת כ${me.role === "admin" ? "מנהל/ת" : "עורך/ת"}. עריכת הלוח מהאפליקציה תתווסף בעדכון הקרוב.</p>
    <div class="row"><button class="ghost" onclick="logout()">יציאה</button><button class="primary" onclick="closeSheet()">סגירה</button></div>`);
  openSheet(`<h3>כניסה למורשי עריכה</h3><p>הקלידו את כתובת המייל שרשומה אצל מנהל המערכת בבית הספר. נשלח אליה קוד כניסה.</p>
    <input type="email" id="lg-email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@example.com" value="${esc(loginEmail)}">
    <div class="err" id="lg-err"></div>
    <div class="row"><button class="ghost" onclick="closeSheet()">ביטול</button><button class="primary" id="lg-send" onclick="sendCode()">שליחת קוד</button></div>`);
  setTimeout(() => document.getElementById("lg-email").focus(), 50);
}
async function sendCode() {
  const email = document.getElementById("lg-email").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) { document.getElementById("lg-err").textContent = "כתובת מייל לא תקינה"; return; }
  const btn = document.getElementById("lg-send"); btn.disabled = true; btn.textContent = "שולח...";
  const { ok, d } = await appApi("/login/start", { email });
  btn.disabled = false; btn.textContent = "שליחת קוד";
  if (!ok) { document.getElementById("lg-err").textContent = d.error || "שגיאה. נסו שוב."; return; }
  loginEmail = email;
  openSheet(`<h3>הקלדת הקוד</h3><p>${esc(d.message || "")}<br><span dir="ltr">${esc(email)}</span></p>
    <input type="text" id="lg-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"
      oninput="if (this.value.replace(/\D/g, '').length === 6) verifyCode()">
    <div class="err" id="lg-err"></div>
    <div class="row"><button class="ghost" onclick="meClick()">מייל אחר / קוד חדש</button><button class="primary" id="lg-ok" onclick="verifyCode()">כניסה</button></div>`);
  setTimeout(() => document.getElementById("lg-code").focus(), 50);
}
async function verifyCode() {
  const code = document.getElementById("lg-code").value.replace(/\D/g, "");
  if (code.length !== 6) { document.getElementById("lg-err").textContent = "הקוד בן 6 ספרות"; return; }
  const btn = document.getElementById("lg-ok"); if (btn.disabled) return; btn.disabled = true;
  const { ok, d } = await appApi("/login/verify", { email: loginEmail, code });
  btn.disabled = false;
  if (!ok) { document.getElementById("lg-err").textContent = d.error || "קוד שגוי"; return; }
  me = d.editor; renderMe(); closeSheet();
}
async function logout() { await appApi("/logout", {}); me = null; renderMe(); closeSheet(); }

const ml = document.createElement("link"); ml.rel = "manifest"; ml.href = location.pathname.replace(/\/$/, "") + "/manifest.json"; document.head.appendChild(ml);
let lastMinute = -1;
setInterval(() => { renderHeader(); const m = new Date().getMinutes(); if (m !== lastMinute) { lastMinute = m; if (board) renderBoard(); } }, 1000);
setInterval(load, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
matchMedia("(min-width: 980px)").addEventListener("change", renderBoard);
renderHeader(); load(); loadMe();
</script>
</body>
</html>
