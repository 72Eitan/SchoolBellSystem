<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת ניהול צלצולים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Rubik', sans-serif;
    direction: rtl;
    background: #eef1f6;
    color: #222;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- כותרת ---------- */
  header {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 14px rgba(0,0,0,0.2);
    z-index: 10;
  }
  .pill-group { display: flex; flex-direction: column; gap: 6px; min-width: 170px; }
  .pill { background: rgba(255,255,255,0.13); border-radius: 8px; padding: 5px 12px; font-size: 0.82rem; }
  .clock-block { text-align: center; }
  #clock { font-size: 2.5rem; font-weight: 900; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; line-height: 1; }
  #clock-sub { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
  .next-block { text-align: center; background: rgba(255,255,255,0.13); border-radius: 10px; padding: 6px 16px; min-width: 170px; }
  .next-label { font-size: 0.75rem; opacity: 0.8; }
  #next-time { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  #next-label-text { font-size: 0.8rem; opacity: 0.9; }

  /* ---------- סרגל בקרה ---------- */
  .controls-bar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 24px 4px 24px;
    align-items: center;
  }
  .controls-bar .title { font-weight: 700; margin-left: auto; color: #444; font-size: 0.9rem; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover { filter: brightness(0.95); transform: translateY(-1px); }
  .btn-enable { background: #dff3e3; color: #1c7a34; }
  .btn-today { background: #fff3d6; color: #916300; }
  .btn-off { background: #fbdede; color: #a5202a; }

  /* ---------- לוח שבועי ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    padding: 8px 24px 16px 24px;
    display: flex;
    flex-direction: column;
  }
  .week-grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .day-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #fff;
    border: 1px solid #e2e6ec;
    border-radius: 12px;
    overflow: hidden;
  }
  .day-col.today { border: 2px solid #a9c3f5; background: #f7faff; }
  .day-head {
    flex: 0 0 auto;
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 8px 4px;
    background: #f0f3f7;
    border-bottom: 1px solid #e2e6ec;
  }
  .day-col.today .day-head { background: #dfeaff; color: #1e3c72; }
  .day-events {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px;
  }
  .day-events::-webkit-scrollbar { width: 6px; }
  .day-events::-webkit-scrollbar-thumb { background: #cdd6e0; border-radius: 4px; }

  .event-card {
    background: #f8f9fb;
    border: 1px solid #e5e8ee;
    border-radius: 8px;
    padding: 6px 8px;
    margin-bottom: 6px;
    cursor: pointer;
    user-select: none;
    min-height: 52px;
    position: relative;
  }
  .event-card:hover { border-color: #a9c3f5; }
  .event-card.next { border: 2px solid #ff8c00; background: #fff6ea; }
  .event-card.disabled { opacity: 0.4; }
  .event-time { font-size: 1rem; font-weight: 800; color: #1e3c72; font-variant-numeric: tabular-nums; }
  .event-label {
    font-size: 0.78rem;
    color: #444;
    margin-top: 1px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .event-icon { position: absolute; top: 5px; left: 6px; font-size: 0.85rem; }

  .add-btn {
    flex: 0 0 auto;
    margin: 6px;
    background: #eef3fb;
    color: #1e3c72;
    border: 1px dashed #a9c3f5;
    font-size: 0.8rem;
  }

  /* ---------- מודל עריכה ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,25,35,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 22px 24px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .modal h3 { margin: 0 0 14px 0; color: #1e3c72; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82rem; color: #555; margin-bottom: 4px; }
  .field input[type=text], .field input[type=time], .field input[type=number], .field select {
    width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid #d6dbe2; font-family: inherit; font-size: 0.9rem;
  }
  .vol-row { display: flex; gap: 8px; align-items: center; }
  .vol-row input[type=range] { flex: 1; }
  .vol-row input[type=number] { width: 62px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn-save { background: #1e3c72; color: #fff; flex: 1; padding: 9px; }
  .btn-delete { background: #fbdede; color: #a5202a; padding: 9px 14px; }
  .btn-cancel { background: #eef1f5; color: #444; padding: 9px 14px; }
</style>
</head>
<body>

<header>
  <div class="pill-group">
    <div class="pill" id="status-pill">⚡ טוען...</div>
    <div class="pill" id="active-pill">🔔 —</div>
  </div>
  <div class="clock-block">
    <div id="clock">--:--:--</div>
    <div id="clock-sub">—</div>
  </div>
  <div class="next-block">
    <div class="next-label">⏭ האירוע הבא</div>
    <div id="next-time">--:--:--</div>
    <div id="next-label-text">—</div>
  </div>
</header>

<div class="controls-bar">
  <button class="btn-enable" onclick="setSystem('enabled')">🟢 הפעל מערכת</button>
  <button class="btn-today" onclick="setSystem('today')">🟡 השבת להיום בלבד</button>
  <button class="btn-off" onclick="setSystem('indefinite')">🔴 השבת עד הפעלה ידנית</button>
  <div class="title">לוח צלצולים שבועי</div>
</div>

<main>
  <div class="week-grid" id="week-grid"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h3 id="modal-title">עריכת אירוע</h3>
    <div class="field checkbox-row">
      <input type="checkbox" id="f-enabled" checked>
      <label for="f-enabled" style="margin:0;">אירוע פעיל</label>
    </div>
    <div class="field">
      <label>שעת התחלה</label>
      <input type="time" id="f-time" step="1">
    </div>
    <div class="field">
      <label>תיאור האירוע</label>
      <input type="text" id="f-label">
    </div>
    <div class="field">
      <label>סוג אירוע</label>
      <select id="f-type">
        <option value="Bell">🔔 צלצול</option>
        <option value="Music">🎵 מוזיקה</option>
        <option value="Exercise">🚨 תרגיל</option>
      </select>
    </div>
    <div class="field">
      <label>קובץ שמע</label>
      <select id="f-audio"></select>
    </div>
    <div class="field">
      <label>עוצמת שמע (%)</label>
      <div class="vol-row">
        <input type="range" id="f-volume-range" min="0" max="100" value="85">
        <input type="number" id="f-volume-num" min="0" max="100" value="85">
      </div>
    </div>
    <div class="field">
      <label>משך (שניות)</label>
      <input type="number" id="f-duration" min="1" max="3600" value="30">
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveEvent()">💾 שמירה</button>
      <button class="btn-delete" id="delete-btn" onclick="deleteEvent()">🗑 מחיקה</button>
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<script>
const DAY_ORDER = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_HEB   = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const TYPE_ICON = {"Bell":"🔔","Music":"🎵","music":"🎵","Exercise":"🚨"};

let schedule = null;
let audioFiles = [];
let modalState = { mode: "add", day: null, index: null };

async function fetchSchedule() {
  const res = await fetch("/api/schedule");
  schedule = await res.json();
  render();
}

async function fetchAudioFiles() {
  const res = await fetch("/api/audio-files");
  audioFiles = await res.json();
  const sel = document.getElementById("f-audio");
  sel.innerHTML = audioFiles.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join("");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.innerText = s;
  return d.innerHTML;
}

function pad2(n) { return String(n).padStart(2, "0"); }

function getNextEvent(now) {
  const todayIdx = now.getDay();
  const nowStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  for (let offset = 0; offset < 8; offset++) {
    const dayIdx = (todayIdx + offset) % 7;
    const dayKey = DAY_ORDER[dayIdx];
    let events = (schedule.weekly_schedule[dayKey] || []).filter(e => e.enabled !== false);
    if (offset === 0) events = events.filter(e => e.time > nowStr);
    events = events.slice().sort((a,b) => a.time.localeCompare(b.time));
    if (events.length) {
      const originalIndex = schedule.weekly_schedule[dayKey].indexOf(events[0]);
      return { dayKey, index: originalIndex, event: events[0] };
    }
  }
  return null;
}

function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  document.getElementById("clock-sub").textContent =
    `יום ${DAY_HEB[now.getDay()]} | ${pad2(now.getDate())}/${pad2(now.getMonth()+1)}/${now.getFullYear()}`;

  if (schedule) {
    const nxt = getNextEvent(now);
    if (nxt) {
      document.getElementById("next-time").textContent = nxt.event.time;
      const sameDay = nxt.dayKey === DAY_ORDER[now.getDay()];
      document.getElementById("next-label-text").textContent =
        sameDay ? nxt.event.label : `${nxt.event.label} (${DAY_HEB[DAY_ORDER.indexOf(nxt.dayKey)]})`;
    } else {
      document.getElementById("next-time").textContent = "--:--:--";
      document.getElementById("next-label-text").textContent = "אין אירועים קרובים";
    }
  }
}

function render() {
  if (!schedule) return;
  const now = new Date();
  const todayKey = DAY_ORDER[now.getDay()];
  const nxt = getNextEvent(now);

  // סטטוס וספירת אירועים פעילים היום
  let statusText = "🟢 פעיל";
  if (schedule.system_status !== "enabled") {
    statusText = schedule.disabled_scope === "day" ? "🟡 מושבת להיום" : "🔴 מושבת";
  }
  document.getElementById("status-pill").textContent = statusText;
  const todaysEvents = schedule.weekly_schedule[todayKey] || [];
  const activeCount = todaysEvents.filter(e => e.enabled !== false).length;
  document.getElementById("active-pill").textContent = `🔔 ${activeCount} אירועים היום`;

  const grid = document.getElementById("week-grid");
  grid.innerHTML = "";

  DAY_ORDER.forEach((dayKey, i) => {
    const col = document.createElement("div");
    col.className = "day-col" + (dayKey === todayKey ? " today" : "");

    const head = document.createElement("div");
    head.className = "day-head";
    head.textContent = DAY_HEB[i];
    col.appendChild(head);

    const eventsWrap = document.createElement("div");
    eventsWrap.className = "day-events";

    const events = (schedule.weekly_schedule[dayKey] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
    events.forEach((ev, idx) => {
      const card = document.createElement("div");
      const isNext = nxt && nxt.dayKey === dayKey && nxt.index === idx;
      card.className = "event-card" + (isNext ? " next" : "") + (ev.enabled === false ? " disabled" : "");
      card.innerHTML = `
        <div class="event-icon">${TYPE_ICON[ev.type] || "🔔"}</div>
        <div class="event-time">${ev.time.slice(0,5)}</div>
        <div class="event-label">${escapeHtml(ev.label || "")}</div>
      `;
      card.addEventListener("dblclick", () => openModal("edit", dayKey, idx));
      eventsWrap.appendChild(card);
    });

    col.appendChild(eventsWrap);

    const addBtn = document.createElement("button");
    addBtn.className = "add-btn";
    addBtn.textContent = "➕ הוסף אירוע";
    addBtn.onclick = () => openModal("add", dayKey, null);
    col.appendChild(addBtn);

    grid.appendChild(col);
  });
}

function openModal(mode, day, index) {
  modalState = { mode, day, index };
  const title = document.getElementById("modal-title");
  const deleteBtn = document.getElementById("delete-btn");

  let ev = { enabled: true, time: "08:00:00", label: "", type: "Bell", audio: audioFiles[0] || "", volume: 85, duration_seconds: 30 };
  if (mode === "edit") {
    ev = schedule.weekly_schedule[day][index];
    title.textContent = `עריכת אירוע — ${DAY_HEB[DAY_ORDER.indexOf(day)]}`;
    deleteBtn.style.display = "inline-block";
  } else {
    title.textContent = `אירוע חדש — ${DAY_HEB[DAY_ORDER.indexOf(day)]}`;
    deleteBtn.style.display = "none";
  }

  document.getElementById("f-enabled").checked = ev.enabled !== false;
  document.getElementById("f-time").value = ev.time || "08:00:00";
  document.getElementById("f-label").value = ev.label || "";
  document.getElementById("f-type").value = ev.type || "Bell";
  if (!audioFiles.includes(ev.audio)) {
    const opt = document.createElement("option");
    opt.value = ev.audio; opt.textContent = ev.audio;
    document.getElementById("f-audio").appendChild(opt);
  }
  document.getElementById("f-audio").value = ev.audio || (audioFiles[0] || "");
  document.getElementById("f-volume-range").value = ev.volume ?? 85;
  document.getElementById("f-volume-num").value = ev.volume ?? 85;
  document.getElementById("f-duration").value = ev.duration_seconds ?? 30;

  document.getElementById("overlay").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("overlay").classList.add("hidden");
}

document.getElementById("f-volume-range").addEventListener("input", e => {
  document.getElementById("f-volume-num").value = e.target.value;
});
document.getElementById("f-volume-num").addEventListener("input", e => {
  document.getElementById("f-volume-range").value = e.target.value;
});

async function saveEvent() {
  const event = {
    enabled: document.getElementById("f-enabled").checked,
    time: document.getElementById("f-time").value || "08:00:00",
    label: document.getElementById("f-label").value || "אירוע חדש",
    type: document.getElementById("f-type").value,
    audio: document.getElementById("f-audio").value,
    volume: parseInt(document.getElementById("f-volume-num").value, 10),
    duration_seconds: parseInt(document.getElementById("f-duration").value, 10)
  };

  if (event.time.length === 5) event.time += ":00";

  if (modalState.mode === "add") {
    await fetch("/api/event", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ day: modalState.day, event })
    });
  } else {
    await fetch("/api/event", {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ day: modalState.day, index: modalState.index, event })
    });
  }
  closeModal();
  await fetchSchedule();
}

async function deleteEvent() {
  if (modalState.mode !== "edit") return;
  if (!confirm("למחוק את האירוע?")) return;
  await fetch("/api/event", {
    method: "DELETE", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ day: modalState.day, index: modalState.index })
  });
  closeModal();
  await fetchSchedule();
}

async function setSystem(mode) {
  await fetch("/api/system", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ mode })
  });
  await fetchSchedule();
}

// אתחול
fetchAudioFiles().then(fetchSchedule);
setInterval(tickClock, 1000);
setInterval(fetchSchedule, 20000); // רענון תוכן כל 20 שניות (מספיק, כי השעון עצמו רץ מקומית)
tickClock();
</script>
</body>
</html>
